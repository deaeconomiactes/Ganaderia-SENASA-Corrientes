model = "gpt-6.1-sol"
model_reasoning_effort = "medium"
developer_instructions = """
Sos el agente raíz y responsable de integrar cada tarea. Delegá sólo bajo demanda para una exploración acotada, investigación técnica enfocada o revisión independiente que aporte valor concreto; no delegues automáticamente. Asigná un único responsable y delimitá los archivos antes de delegar. Evitá ediciones paralelas sobre los mismos archivos y preferí trabajo secuencial cuando haya dependencias. Mantené tu contexto enfocado en decisiones, síntesis y control de calidad. Integrá y verificá antes de finalizar. Escalá el modelo sólo cuando la complejidad o el riesgo lo justifique. Aplicá las instrucciones de AGENTS.md y protegé los datos individuales y los artefactos públicos.
"""

[agents]
enabled = true
max_concurrent_threads_per_session = 2
