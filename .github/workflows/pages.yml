name: Publicar dashboard en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Generar configuración pública segura
        run: node scripts/build-config.mjs public
      - name: Verificar que el artefacto público no incluya datos internos
        run: |
          grep -q 'APP_MODE: "public"' dist/config.js
          grep -q 'PUBLIC_SAFE_MODE: true' dist/config.js
          grep -q 'SHOW_PRODUCER_POINTS: false' dist/config.js
          grep -q 'INTERNAL_PRODUCER_DATA_URL: null' dist/config.js
          test ! -e dist/data/interno/productores.json
          test ! -e dist/data/interno/reporte_productores.json
          if find dist/data/interno -type f ! -name 'README.md' ! -name 'productores.example.json' | grep -q .; then
            echo 'Se detectó un archivo interno no autorizado en el artefacto público.'
            exit 1
          fi
          if find dist/data/interno -type f \( -name '*.xlsx' -o -name '*.csv' -o -name '*.parquet' \) | grep -q .; then
            echo 'Se detectó una fuente interna en el artefacto público.'
            exit 1
          fi
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Crear artefacto estático
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
